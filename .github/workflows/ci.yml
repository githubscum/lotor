name: ci

# Fork PRs run under `pull_request` with a read-only token and no secrets.
# Never switch this to `pull_request_target`: that runs outside code with
# write access.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          # Windows checks out CRLF (core.autocrlf=true): catches the
          # line-ending class of bug (KNOWN-LIMITS 77, 81).
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the committed-pin tripwire resolves the last src/ commit
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run limits-pin -- --check

  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Runs the guard from the BASE branch, so a PR cannot edit the guard
      # that judges it. Falls back to the PR's copy only when the base has
      # none, which is true once: the PR that introduces it.
      - run: >
          git show "${{ github.event.pull_request.base.sha }}:.github/scripts/pr-guard.sh" > "$RUNNER_TEMP/pr-guard.sh"
          || cp .github/scripts/pr-guard.sh "$RUNNER_TEMP/pr-guard.sh"
      - run: >
          bash "$RUNNER_TEMP/pr-guard.sh"
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          "${{ github.event.pull_request.head.repo.full_name != github.repository }}"
